<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Logos Bridge — pairing</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 2em auto; color: #222; }
  label { display: block; margin-top: 1em; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 0.4em; margin-top: 0.3em; }
  button { margin-top: 1em; padding: 0.5em 1em; }
  #status { margin-top: 1em; font-size: 13px; }
  .ok { color: #16794f; }
  .err { color: #a3242e; }
  p.hint { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h2>Logos Bridge</h2>
  <p class="hint">
    Pair this extension with the local <code>brain mcp serve --http</code>
    process. Nothing here leaves this machine — the token and port only ever
    talk to 127.0.0.1.
  </p>

  <label for="port">Port</label>
  <input id="port" type="number" placeholder="8137">

  <label for="token">Pairing token</label>
  <input id="token" type="text" placeholder="printed by `brain mcp serve --http`">

  <button id="save">Save</button>
  <button id="test">Test connection</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
